services:
  postgres:
    image: postgres:16
    container_name: n8n-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Arbitrum123
      POSTGRES_DB: n8n_saas

    ports:
      - "5433:5432"

    volumes:
      - n8n_saas_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: n8n-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - n8n
    env_file:
      - ./backend/.env

volumes:
  n8n_saas_data:
  n8n_data: